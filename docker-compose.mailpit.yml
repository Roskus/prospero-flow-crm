# Catches every email sent by the application; inbox at http://localhost:8025
# docker compose -f docker-compose.mailpit.yml up -d
# .env: MAIL_MAILER=smtp MAIL_HOST=host.docker.internal MAIL_PORT=1025 MAIL_ENCRYPTION=null
# (MAIL_HOST=mailpit also works when started together with docker-compose.yml; 127.0.0.1 only when PHP runs outside Docker)
services:
  mailpit:
    image: axllent/mailpit:v1.20.0
    container_name: crm-mailpit
    restart: always
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_WEB_PORT:-8025}:8025"
