sonar.projectKey=Roskus_prospero-flow-crm
sonar.organization=roskus
sonar.projectVersion=${APP_VERSION}

# PHP configuration
sonar.sources=app,config,routes,bootstrap
sonar.tests=tests
sonar.php.coverage.reportPaths=coverage.xml

# Exclusions
sonar.exclusions=**/CreatesApplication.php,vendor/**,node_modules/**,storage/**,bootstrap/cache/**,database/**
sonar.test.exclusions=tests/CreatesApplication.php

# Code duplication
sonar.cpd.exclusions=tests/**

# Rule exclusions
# Ignore S1172 (unused parameters) in all Controllers - $request parameter used for validation via FormRequest
sonar.issue.ignore.multicriteria=s1,s2
sonar.issue.ignore.multicriteria.s1.ruleKey=php:S1172
sonar.issue.ignore.multicriteria.s1.resourceKey=**/Http/Controllers/**/*Controller.php

# Ignore S1192 (duplicated string literals) in tests - repeated URLs and payload keys keep each test readable
sonar.issue.ignore.multicriteria.s2.ruleKey=php:S1192
sonar.issue.ignore.multicriteria.s2.resourceKey=tests/**
