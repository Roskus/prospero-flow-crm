<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1 data-i18n="extName"></h1>

  <form id="login-form" hidden novalidate>
    <label>
      <span data-i18n="crmUrl"></span>
      <input id="crm-url" type="url" required placeholder="https://crm.example.com" autocomplete="url">
    </label>
    <p id="http-warning" class="warning" data-i18n="httpWarning" hidden></p>
    <label>
      <span data-i18n="email"></span>
      <input id="email" type="email" required autocomplete="username">
    </label>
    <label>
      <span data-i18n="password"></span>
      <input id="password" type="password" required autocomplete="current-password">
    </label>
    <p id="login-error" class="error" role="alert" hidden></p>
    <button type="submit" data-i18n="login"></button>
  </form>

  <section id="account" hidden>
    <p data-i18n="loggedInAs"></p>
    <p><strong id="user-name"></strong><br><span id="company-name"></span></p>
    <p><a id="crm-link" target="_blank" rel="noopener"></a></p>
    <p class="hint" data-i18n="popupHint"></p>
    <button id="logout" type="button" data-i18n="logout"></button>
  </section>

  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
